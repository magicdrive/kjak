name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # QUALITY GATES: exactly the CI of every pull request (as in ark).
  ci:
    uses: ./.github/workflows/ci.yml

  # RELEASE: as in enma. GoReleaser creates the release as a draft, uploads
  # the archives and publishes it (the repository's immutable releases then
  # freeze it), and writes the formula at the root of magicdrive/homebrew-tap.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the release
      id-token: write      # the build provenance attestation
      attestations: write
    steps:
      # GoReleaser pushes the formula after the release is published: a
      # missing tap token stops here instead (a pre-release leaves the tap).
      - name: The tap token is set
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) [ -n "$TAP_GITHUB_TOKEN" ] || { echo "the secret TAP_GITHUB_TOKEN is not set"; exit 1; } ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser builds the changelog from the tags
          persist-credentials: false  # GoReleaser uses GITHUB_TOKEN from the environment

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Build and check the archives before anything is published.
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=publish

      - name: Verify archives
        run: sh scripts/verify-dist.sh dist snapshot

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.2  # pinned; the config is checked with this version
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # `gh attestation verify <archive> --repo magicdrive/kjak` (README)
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/kjak_checksums.txt
