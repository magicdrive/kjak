name: Mutation

# Mutation testing of the security-critical paths (scripts/mutation.sh,
# scripts/mutants.tsv: secret permissions, trust, SSRF, redirects, plugin
# authorization, cancellation, retry, redaction). It takes minutes, so it
# does not run on pull requests (ci.yml only checks that every mutant still
# applies): weekly, and on demand. A surviving mutant fails the run: add the
# test that kills it.

on:
  schedule:
    - cron: '17 3 * * 1'  # Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      mutants:
        description: 'Only the mutants whose id matches this regex (empty: all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Mutation testing
        # shell: bash runs with -o pipefail: without it, the default
        # `bash -e {0}` takes the status of tee, and a surviving mutant
        # would not fail the run (exitcode_test.go).
        shell: bash
        env:
          MUTANTS: ${{ inputs.mutants }}
        run: sh scripts/mutation.sh "$MUTANTS" | tee mutation.txt

      - name: Summary
        if: always()
        run: |
          if [ -f mutation.txt ]; then
            { echo '```'; tail -n 5 mutation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
