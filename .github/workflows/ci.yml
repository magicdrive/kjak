name: CI

# Every push to main and every pull request; release.yml runs it too
# (workflow_call) before a tag is released. The layout follows enma's ci.yml
# (test, lint, dist) plus ark's fuzz smoke.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Windows is tested on every change: kjak has Windows code of its own (the
  # configuration lock, paths), which broke there once already.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Includes the end-to-end tests of the built binary (internal/e2e).
      # -count=1: no cached results.
      - name: Test
        run: go test -count=1 ./...

      # the race detector needs cgo, which the Windows image lacks
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -count=1 -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Module files are tidy
        run: |
          go mod verify
          go mod tidy -diff

      - name: Staticcheck
        run: make staticcheck  # version pinned in the Makefile (STATICCHECK)

      - name: Go vet for windows
        run: GOOS=windows go vet ./...

      - name: Shell scripts
        run: shellcheck -s sh scripts/*.sh

  # kjak parses what it does not control (TOML, webhook and SMTP replies).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Fuzz every target for 10s
        run: make fuzz

  # Builds every release target from the real GoReleaser config and checks the
  # archives. Nothing is published (--snapshot --skip=publish).
  dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Govulncheck
        run: make vulncheck  # version pinned in the Makefile (GOVULNCHECK)

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.2  # pinned; the config is checked with this version
          args: release --snapshot --clean --skip=publish

      - name: Verify archives
        run: sh scripts/verify-dist.sh dist snapshot
