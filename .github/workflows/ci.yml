name: CI

# The gate of every push to main and every pull request; release.yml runs it
# too (workflow_call) on the commit of a tag before anything is built for
# release. The required check of the main branch ruleset is "CI Gate".
#
# Every check runs a Makefile target, so CI, the release and a local
# `make check` run the same commands with the same pinned tools.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain of go.mod; tests, release builds and the tools use it.
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  GORELEASER_VERSION: v2.18.2

jobs:
  quality:
    name: Quality / Format / Module Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format and module files (gofmt, go mod verify, go mod tidy)
        run: make fmt-check

      - name: Vet (linux and windows)
        run: make vet

      - name: Critical test manifest
        run: make critical-check

      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do sh -n "$f"; done
          shellcheck --version | head -2
          shellcheck -s sh scripts/*.sh

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Staticcheck (version pinned in the Makefile)
        run: make staticcheck

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck (version pinned in the Makefile; the standard library included)
        run: make vulncheck

  test:
    name: Unit / Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Includes the end-to-end tests of the built binary (internal/e2e).
      - name: Test
        if: runner.os != 'Windows'
        run: make test

      # The command of `make test` (GNU make is not part of every Windows
      # image).
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: CGO_ENABLED=0 go test -count=1 ./...

  race:
    name: Race (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test with the race detector
        run: make race

  coverage:
    name: Coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # No threshold: the profile and the report are the deliverable.
      - name: Coverage profile and HTML report
        run: make coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error

  critical-repeat:
    name: Critical Repeat 20x (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Critical tests, 20 times each (manifest checked, every test must run)
        run: make critical-test

  critical-race:
    name: Critical Race 5x (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Critical tests with the race detector, 5 times each
        run: make critical-race

  fuzz:
    name: Fuzz Smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Every fuzz target, 10s each
        run: make fuzz

  cross-build:
    name: Cross Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/arm64, darwin/amd64, linux/arm64, linux/amd64, windows/amd64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is `git describe`
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (CGO_ENABLED=0)
        run: make ${{ matrix.target }}

      - name: Artifact name
        id: name
        run: echo "name=kjak-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: build/
          if-no-files-found: error
          retention-days: 3

  native-smoke:
    name: Native Smoke (${{ matrix.os }})
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            bin: kjak
          - os: macos-latest
            target: darwin-arm64
            bin: kjak
          - os: windows-latest
            target: windows-amd64
            bin: kjak.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cross-built binary, not one built here: what is shipped is what
      # is run.
      - name: Download the cross-built binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kjak-${{ matrix.target }}
          path: build

      - name: Smoke test
        shell: bash
        run: |
          chmod +x "build/${{ matrix.target }}/${{ matrix.bin }}" || true
          sh scripts/smoke.sh "build/${{ matrix.target }}/${{ matrix.bin }}"

  release-dry-run:
    name: Release Dry Run (GoReleaser snapshot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GoReleaser (pinned)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      # check, snapshot --skip=publish, verify-dist, formula: nothing is
      # published (no token is given to this job)
      - name: Snapshot archives and formula
        run: make snapshot

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - staticcheck
      - vulncheck
      - test
      - race
      - coverage
      - critical-repeat
      - critical-race
      - fuzz
      - cross-build
      - native-smoke
      - release-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Green only when every required job succeeded: a failed, skipped or
      # cancelled job fails the gate (scripts_test.go tests the script).
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_JOBS: 12
        run: sh scripts/ci-gate.sh
