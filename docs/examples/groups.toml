# Groups: one name for several feathers. A member whose levels exclude the
# message's level is skipped (the send still succeeds).
#   kjak send --to team "Deployed"                 # desktop and slack
#   kjak send --to team --level error "Failed"     # and mail too

[feathers.desktop]
type = "os"

[feathers.slack]
type = "slack"
webhook_url = { env = "KJAK_SLACK_WEBHOOK" }

[feathers.mail]
type = "email"
host = "smtp.example.com"
user = "kjak@example.com"
password = { env = "KJAK_SMTP_PASSWORD" }
from = "kjak@example.com"
to = ["team@example.com"]
levels = ["error", "critical"]

[groups.team]
feathers = ["desktop", "slack", "mail"]
