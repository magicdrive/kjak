# Secrets in a file of their own: secrets.toml next to this file (mode 0600;
# --secrets FILE or $KJAK_SECRETS choose another). This configuration names
# them; secrets.example.toml shows that file.
#   chmod 600 ~/.config/kjak/secrets.toml
#   kjak config validate

[feathers.slack]
type = "slack"
webhook_url = { secret = "slack.webhook_url" }

[feathers.gmail]
type = "email"
host = "smtp.gmail.com"
port = 587
user = "you@gmail.com"
password = { secret = "gmail.password" }
from = "you@gmail.com"
to = ["you@gmail.com"]

[feathers.api]
type = "http"
url_secret = { secret = "api.url" }

[feathers.api.auth]
type = "basic"
username = "kjak"
password = { secret = "api.password" }
