# GoReleaser configuration of kjak, checked with GoReleaser v2.18.2 (pinned
# in the Makefile and the workflows).
#
# GoReleaser builds, archives and checksums; it publishes nothing. The release
# workflow (.github/workflows/release.yml) runs it with --skip=publish, attests
# the archives, uploads exactly those files to a draft release, verifies them,
# publishes the release (immutable), and only then publishes the Homebrew
# formula, which scripts/formula.sh writes from checksums.txt. `brews` is not
# used: it is deprecated in GoReleaser v2, and it would push the formula in
# the same step as the release upload, before the release is verified and
# published (docs/release.md).
version: 2

project_name: kjak

builds:
  - id: kjak
    main: ./main.go
    binary: kjak
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X "main.version=v{{.Version}}"
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: kjak
    ids: [kjak]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

release:
  disable: true
