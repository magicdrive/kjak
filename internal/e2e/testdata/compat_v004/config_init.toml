# kjak configuration (https://github.com/magicdrive/kjak/blob/main/docs/configuration.md)
#
# Secrets are references, never plain values here, unless you choose literal:
#   webhook_url = { env = "KJAK_DEV_SLACK_WEBHOOK" }
#   webhook_url = { keychain = { service = "kjak", account = "dev_slack" } }
#   webhook_url = { literal = "https://hooks.slack.com/services/..." }

